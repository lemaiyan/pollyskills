name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Package skills
        run: ./scripts/package-skill.sh --all

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.skill \
            --title "${{ github.ref_name }}" \
            --generate-notes
